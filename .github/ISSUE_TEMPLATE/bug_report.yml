name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. curl ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove secrets and personal data.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version and OS
      placeholder: go1.22.9 linux/amd64
